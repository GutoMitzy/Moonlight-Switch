name: Release
run-name: ${{ inputs.tag || github.ref_name }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Switch workflow run ID
        required: true
        type: string
      tag:
        description: Tag of an existing draft prerelease targeted at the build commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Check out release scripts
      uses: actions/checkout@v7

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Collect release assets
      shell: bash
      run: python3 scripts/ci/collect_release.py "$GITHUB_REF_NAME" artifacts dist

    - name: Create or update release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
        else
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        fi

  publish-switch-prerelease:
    name: Publish existing Switch 1 artifact
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Verify build and publish draft
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_RUN: ${{ inputs.source_run }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
        [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*-preview\.[0-9]+$ ]]

        build_commit=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" |
          jq -er 'select(.path == ".github/workflows/switch.yml" and .conclusion == "success") | .head_sha')
        gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish |
          jq -e --arg commit "$build_commit" '.isDraft and .isPrerelease and .targetCommitish == $commit' >/dev/null

        artifact=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" |
          jq -cer '[.artifacts[] | select(.name == "Moonlight-Switch.nro" and (.expired | not))] |
            select(length == 1) | .[0]')
        artifact_id=$(jq -er '.id' <<< "$artifact")
        digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$")) | sub("^sha256:"; "")' <<< "$artifact")

        work=$(mktemp -d)
        trap 'rm -rf -- "$work"' EXIT
        cd "$work"
        gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > actions-artifact.zip
        printf '%s  %s\n' "$digest" actions-artifact.zip | sha256sum --check
        unzip -p actions-artifact.zip Moonlight-Switch.nro > Moonlight-Switch.nro
        test "$(dd if=Moonlight-Switch.nro bs=1 skip=16 count=4 status=none)" = NRO0

        gh release upload "$RELEASE_TAG" Moonlight-Switch.nro
        gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
