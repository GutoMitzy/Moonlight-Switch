name: Switch

# One NRO build only when explicitly launched. Also reusable by a
# deliberate workflow_call (e.g. tagged release).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Switch 1
            platform: switch1
            image: devkitpro/devkita64:latest

    container:
      image: ${{ matrix.image }}

    defaults:
      run:
        shell: bash

    env:
      DEVKITPRO: /opt/devkitpro
      OUNCE_DEVKIT_VERSION: '20261115b'
      OUNCE_DEVKIT_SHA256: e6866198bfb44144c8227288c6315772a6a505cacca54b08cd0e6232a84f4729

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Remove useless fonts
        if: matrix.platform == 'switch1'
        run: rm -rf ./resources/font

      - name: Remove enet
        if: matrix.platform == 'switch1'
        run: dkp-pacman --noconfirm -R switch-enet

      - name: Validate sixaxis motion quality rules
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/sixaxis_quality_test.cpp \
            -o /tmp/sixaxis_quality_test
          /tmp/sixaxis_quality_test

      - name: Validate bounded chronological motion sample processing
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/motion_sample_timing_test.cpp \
            -o /tmp/motion_sample_timing_test
          /tmp/motion_sample_timing_test

      - name: Validate handheld vs docked motion report comparison
        if: matrix.platform == 'switch1'
        run: |
          python3 -m unittest discover -s tests -p 'test_compare_dock_motion.py' -v

      - name: Validate persistent physical Joy-Con seats
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/stable_joycon_identity_test.cpp \
            -o /tmp/stable_joycon_identity_test
          /tmp/stable_joycon_identity_test

      - name: Validate physical Joy-Con gyro mouse selection
        if: matrix.platform == 'switch1'
        run: |
          python3 -m unittest discover -s tests -p 'test_gyro_mouse_shortcuts.py' -v
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include \
            tests/mouse_mode_combo_test.cpp \
            -o /tmp/mouse_mode_combo_test
          /tmp/mouse_mode_combo_test

      - name: Validate native Pro Controller and mixed Joy-Con seat ordering
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/hybrid_controller_slots_test.cpp \
            -o /tmp/hybrid_controller_slots_test
          /tmp/hybrid_controller_slots_test
          python3 -m unittest discover -s tests -p 'test_pro_controller_compatibility.py' -v

      - name: Validate wireless HOME owner fallback
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/system_button_owner_test.cpp \
            -o /tmp/system_button_owner_test
          /tmp/system_button_owner_test

      - name: Validate wireless input and motion backlog regressions
        if: matrix.platform == 'switch1'
        run: |
          python3 -m unittest discover -s tests -p 'test_wireless_input_regressions.py' -v

      - name: Validate gyro pointer stability
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/gyro_pointer_filter_test.cpp \
            -o /tmp/gyro_pointer_filter_test
          /tmp/gyro_pointer_filter_test

      - name: Validate quaternion aim reference and gyro pointer geometry
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/gyro_aim_pointer_test.cpp \
            -o /tmp/gyro_aim_pointer_test
          /tmp/gyro_aim_pointer_test

      - name: Validate gyro calibration hold shortcut
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/gyro_calibration_hold_test.cpp \
            -o /tmp/gyro_calibration_hold_test
          /tmp/gyro_calibration_hold_test

      - name: Validate motion event input guards for multiple controllers
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/motion_packet_validation_test.cpp \
            -o /tmp/motion_packet_validation_test
          /tmp/motion_packet_validation_test

      - name: Validate synthetic gyro target tracking
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/gyro_aim_accuracy_synthetic_test.cpp \
            -o /tmp/gyro_aim_accuracy_synthetic_test
          /tmp/gyro_aim_accuracy_synthetic_test

      - name: Validate stable Joy-Con pairing and controller enumeration
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/stable_joycon_slots_test.cpp \
            -o /tmp/stable_joycon_slots_test
          /tmp/stable_joycon_slots_test

      - name: Validate optional gyro motion CSV trace writer
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iextern/borealis/library/include \
            extern/borealis/tests/motion_trace_csv_test.cpp \
            -o /tmp/motion_trace_csv_test
          /tmp/motion_trace_csv_test

      - name: Validate gyro accuracy evaluation tool
        if: matrix.platform == 'switch1'
        run: |
          python3 -m unittest discover -s tests -p 'test_gyro_target_evaluation.py' -v

      - name: Validate motion CSV schemas and offline analysis
        if: matrix.platform == 'switch1'
        run: |
          python3 -m unittest discover -s tests -p 'test_motion_trace_*.py' -v

      - name: Verify persistent virtual pad seats
        if: matrix.platform == 'switch1'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Iapp/include tests/stable_virtual_gamepad_count_test.cpp \
            -o /tmp/stable_virtual_gamepad_count_test
          /tmp/stable_virtual_gamepad_count_test

      - name: Initial CMake configuration
        if: matrix.platform == 'switch1'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/switch
          cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON \
            2>&1 | tee build/switch/configure-initial.log

      - name: Final CMake configuration
        if: matrix.platform == 'switch1'
        run: |
          set -euo pipefail
          cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON \
            2>&1 | tee build/switch/configure-final.log

      - name: Build Switch NRO
        if: matrix.platform == 'switch1'
        run: |
          set -euo pipefail
          make -C build/switch Moonlight.nro -j8 \
            2>&1 | tee build/switch/compile.log

      - name: Upload Switch build error diagnostics
        if: failure() && matrix.platform == 'switch1'
        uses: actions/upload-artifact@v7
        with:
          name: Switch-build-failure-logs
          path: |
            build/switch/configure-initial.log
            build/switch/configure-final.log
            build/switch/compile.log
            build/switch/CMakeFiles/CMakeConfigureLog.yaml
            build/switch/CMakeFiles/CMakeError.log
            build/switch/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore

      - name: Rename artifact
        if: matrix.platform == 'switch1'
        run: |
          mv build/switch/Moonlight.nro build/switch/Moonlight-Switch.nro
          cp build/switch/Moonlight.elf build/switch/Debug.elf

      - name: Upload Moonlight-Switch.nro
        if: matrix.platform == 'switch1'
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Switch.nro
          path: build/switch/Moonlight-Switch.nro
          if-no-files-found: error

      - name: Upload Debug.elf
        if: matrix.platform == 'switch1'
        uses: actions/upload-artifact@v7
        with:
          name: Debug.elf
          path: build/switch/Debug.elf
          if-no-files-found: error

      - name: Install host build tools
        if: matrix.platform == 'switch2'
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git glslang-tools \
            ninja-build pkg-config python3 spirv-tools xz-utils

      - name: Install the public Switch 2 SDK
        if: matrix.platform == 'switch2'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ounce-devkit.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/ouncebrew/ounce-devkit/releases/download/devkit-${OUNCE_DEVKIT_VERSION}/ounce-devkit-${OUNCE_DEVKIT_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$OUNCE_DEVKIT_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$DEVKITPRO"
          test -f "$DEVKITPRO/libounce/cmake/Switch2.cmake"
          cat "$DEVKITPRO/ounce-devkit-version.txt"

      - name: Cache Switch 2 dependencies
        if: matrix.platform == 'switch2'
        uses: actions/cache@v6
        with:
          path: build/deps
          key: switch2-linux-devkita64-20260219-${{ env.OUNCE_DEVKIT_SHA256 }}-${{ hashFiles('scripts/switch2/dependencies.sh', 'scripts/switch2/sources.sha256', 'scripts/switch2/mbedtls_entropy.c', 'scripts/switch2/prepare_expat.py') }}

      - name: Build and validate native Vulkan NRO
        if: matrix.platform == 'switch2'
        run: bash scripts/switch2/build.sh --run-tests

      - name: Package the SD card installation
        if: matrix.platform == 'switch2'
        run: python3 scripts/switch2/package_ci.py

      - name: Upload Switch 2 installation
        if: matrix.platform == 'switch2'
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Switch2
          path: build/dist-switch2/Moonlight-Switch2.zip
          if-no-files-found: error

      - name: Upload Switch 2 debug symbols and validation
        if: matrix.platform == 'switch2'
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Switch2-debug
          path: |
            build/switch2/Moonlight.elf
            build/switch2/Moonlight.map
            build/switch2/validation.json
            build/switch2-generated/source-fingerprint.json
            build/switch2-generated/shader-validation.json
          if-no-files-found: error

      - name: Upload build diagnostics
        if: failure() && matrix.platform == 'switch2'
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Switch2-build-logs
          path: |
            build/deps/switch2-work/*.log
            build/switch2/CMakeFiles/CMakeConfigureLog.yaml
            build/switch2/CMakeFiles/CMakeError.log
            build/switch2/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
